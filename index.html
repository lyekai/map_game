<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣地理經緯度大戰</title>
    <link rel="stylesheet" href="/static/css/index.css" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- PapaParse CSV 解析套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <!-- 1. 主畫面與模式選擇 -->
    <div id="main-container">
        <div class="menu-content">
            <!-- 開始遊戲按鈕 -->
            <div id="start-box" class="clickable-box" onclick="handleStartClick()">
                <img src="./static/element/start.png" alt="遊戲 Logo" class="logo-img">
                <div class="start-text">開始遊戲</div>
            </div>

            <!-- 模式選擇 -->
            <div id="mode-select-container">
                <div id="normal-mode-btn" class="clickable-box mode-box" onclick="startNormalMode()">
                    <span class="mode-emoji">🙂</span>
                    <div class="mode-title">正常模式</div>
                </div>
                <!-- 變態模式觸發 -->
                <div id="hard-mode-btn" class="clickable-box mode-box" onclick="showHardCategorySelect()">
                    <span class="mode-emoji">🤯</span>
                    <div class="mode-title">變態模式</div>
                </div>
            </div>

            <!-- 🆕 變態模式類別選擇介面 -->
            <div id="hard-category-container" style="display: none;">
                <button class="back-btn" onclick="backToModeSelect()">↩ 返回模式選擇</button>
                <h2 class="category-select-title">請選擇主題</h2>
                
                <!-- 3個一排的類別盒子容器 -->
                <div class="category-grid">
                    <div class="category-box" onclick="selectCategory('冰店', this)">🍧 冰店</div>
                    <div class="category-box" onclick="selectCategory('咖啡廳', this)">☕ 咖啡廳</div>
                    <div class="category-box" onclick="selectCategory('火鍋店', this)">🍲 火鍋店</div>
                </div>

                <!-- 右下角閃爍 GO 按鈕 -->
                <button id="go-btn" class="blink-go-btn" style="display: none;" onclick="startHardGame()">GO！</button>
            </div>
        </div>
    </div>
    
    <!-- 2. 遊戲介面 -->
    <div id="game-container">
        <!-- 🆕 變態模式進入遊戲時的開場對話框 -->
        <div id="dialog-overlay" class="dialog-overlay" style="display: none;">
            <div class="dialog-card">
                <div id="dialog-text" class="dialog-text"></div>
                <button class="dialog-btn" onclick="closeDialog()">挑戰開始！</button>
            </div>
        </div>

        <div id="header-panel">
            <div id="game-title-display">🗺️ 台灣地理經緯度大戰</div>
            <div id="status-display">進度: 0/10 | 當前累計分數: 0 分</div>
        </div>

        <div id="game-main-content">
            <div id="map-wrapper">
                <div id="map"></div>
            </div>

            <div id="control-panel">
                <div class="game-box" id="question-box">
                    <div id="question-title">正在載入關卡...</div>
                    
                    <!-- 🆕 重構：帶有左右箭頭的圖片輪播容器 -->
                    <div id="image-container">
                        <button id="img-prev-btn" class="img-arrow left" onclick="changeImage(-1)" style="display:none;">❮</button>
                        <img id="target-image" src="" alt="地標圖片" style="display: none;">
                        <button id="img-next-btn" class="img-arrow right" onclick="changeImage(1)" style="display:none;">❯</button>
                    </div>

                    <div class="button-wrapper">
                        <button id="confirm-btn" class="action-btn" onclick="handleConfirmClick()" style="display: none;">確認送出</button>
                    </div>
                </div>

                <div class="game-box" id="feedback-box">
                    <div id="feedback-title">📋 導師提示系統</div>
                    <div id="feedback-text">歡迎挑戰！請在地圖上點擊你預測的落點。</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 全域變數與遊戲設定 ---
        const GEMINI_API_KEY = "AIzaSyBnJdq3TcKZ9EGlBLcnVOLyl_p6mtt4ci8";
        const EARTH_RADIUS_KM = 6371.0;
        const cartoApiKey = 'cb1_3w0d_1_aa9facafe042a7b95aff6b71';

        // 備份題庫（防呆）
        const backupQuizPool = [
            { category: "台灣地理", name: "東沙環礁國家公園", lng: 116.8982, lat: 20.6553, image: "/static/image/東沙環礁國家公園.png", hint_1: "東沙環礁擁有豐富珊瑚礁生態與白沙灘。", hint_2: "位於南海北部，是台灣極具國防與海洋保育價值的環礁國家公園。" }
        ];

        let quizPool = [];
        let selectedIndices = [];
        let currentRound = 0;
        let totalScore = 0;

        // 變態模式變數
        let gameMode = "NORMAL"; // "NORMAL" 或 "HARD"
        let selectedCategory = "";
        let usedHistory = {}; // 紀錄各類別已抽過的題目索引

        // 多張圖片輪播變數
        let currentImageList = [];
        let currentImageIndex = 0;

        let gameState = "WAITING_FIRST_CONFIRM";
        let isTyping = false;
        let userLat = null;
        let userLng = null;

        let map = null;
        let currentMarker = null;
        let targetMarker = null;
        let connectionLine = null;

        // --- 1. 主選單與變態模式切換 UI 邏輯 ---
        function handleStartClick() {
            const startBox = document.getElementById('start-box');
            const modeContainer = document.getElementById('mode-select-container');
            startBox.classList.add('fade-out');

            setTimeout(() => {
                startBox.style.display = 'none';
                modeContainer.style.display = 'flex';
                document.getElementById('normal-mode-btn').classList.add('show');
                document.getElementById('hard-mode-btn').classList.add('show');
            }, 400);
        }

        // 顯示變態模式選擇面板
        function showHardCategorySelect() {
            document.getElementById('mode-select-container').style.display = 'none';
            document.getElementById('hard-category-container').style.display = 'flex';
        }

        // 回到模式選擇
        function backToModeSelect() {
            document.getElementById('hard-category-container').style.display = 'none';
            document.getElementById('mode-select-container').style.display = 'flex';
            // 清除選取狀態
            selectedCategory = "";
            document.querySelectorAll('.category-box').forEach(box => box.classList.remove('selected'));
            document.getElementById('go-btn').style.display = 'none';
        }

        // 選擇類別
        function selectCategory(categoryName, element) {
            selectedCategory = categoryName;
            document.querySelectorAll('.category-box').forEach(box => box.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('go-btn').style.display = 'block';
        }

        // --- 2. 模式啟動進入遊戲 ---
        function startNormalMode() {
            gameMode = "NORMAL";
            document.getElementById('game-title-display').innerText = "🗺️ 台灣地理經緯度大戰";
            enterGame();
        }

        function startHardGame() {
            gameMode = "HARD";
            document.getElementById('game-title-display').innerText = `🔥 變態模式 - 【${selectedCategory}】達人挑戰`;
            enterGame();

            // 顯示變態模式開場對話框
            document.getElementById('dialog-text').innerText = `請問你是${selectedCategory}的達人呢？\n還是...騙人的阿呆！`;
            document.getElementById('dialog-overlay').style.display = 'flex';
        }

        function closeDialog() {
            document.getElementById('dialog-overlay').style.display = 'none';
        }

        function enterGame() {
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            initMap();
            loadCSVQuizData();
        }

        // --- 3. 地圖初始化 ---
        function initMap() {
            if (map) return;
            const taiwanBounds = L.latLngBounds(L.latLng([19.5, 115.5]), L.latLng([25.6, 122.5]));
            map = L.map('map', {
                center: [23.6, 120.8], zoom: 8, minZoom: 7.5, maxZoom: 11,
                maxBounds: taiwanBounds, maxBoundsViscosity: 1.0, zoomControl: true
            });

            L.tileLayer(`https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png?key=${cartoApiKey}`, {
                attribution: '© OpenStreetMap © CartoDB'
            }).addTo(map);

            map.on('click', function(e) {
                if (isTyping) return;
                if (gameState !== "WAITING_FIRST_CONFIRM" && gameState !== "WAITING_SECOND_CONFIRM") return;

                userLat = e.latlng.lat;
                userLng = e.latlng.lng;
                const btn = document.getElementById('confirm-btn');

                if (gameState === "WAITING_FIRST_CONFIRM") {
                    if (currentMarker) map.removeLayer(currentMarker);
                    currentMarker = L.marker([userLat, userLng], {
                        icon: L.icon({
                            iconUrl: 'https://maps.google.com/mapfiles/ms/icons/yellow-dot.png',
                            iconSize: [32, 32], iconAnchor: [16, 32]
                        })
                    }).addTo(map);

                    document.getElementById('feedback-text').innerText = "已選定落點！點擊右下角『確認提示』進行驗證。";
                    btn.innerText = "確認提示";
                    btn.style.display = "block";
                    btn.disabled = false;
                } 
                else if (gameState === "WAITING_SECOND_CONFIRM") {
                    if (currentMarker) map.removeLayer(currentMarker);
                    currentMarker = L.marker([userLat, userLng]).addTo(map);

                    document.getElementById('feedback-text').innerText = "已調整落點！點擊右下角『確認送出』結算。";
                    btn.innerText = "確認送出";
                    btn.style.display = "block";
                    btn.disabled = false;
                }
            });
        }

        // --- 4. CSV 讀取與題目組裝（含不重複抽題） ---
        function loadCSVQuizData() {
            fetch("./地圖遊戲.csv")
                .then(res => res.text())
                .then(csvText => {
                    const results = Papa.parse(csvText.replace(/^\uFEFF/, ''), { header: true, skipEmptyLines: true });
                    
                    let targetCategory = (gameMode === "NORMAL") ? "台灣地理" : selectedCategory;

                    const filtered = results.data.filter(item => {
                        const cat = item["類別"] ? item["類別"].trim() : "";
                        const name = item["地標"] ? item["地標"].trim() : "";
                        return cat === targetCategory && name !== "";
                    });

                    if (filtered.length > 0) {
                        quizPool = filtered.map(row => ({
                            category: row["類別"].trim(),
                            name: row["地標"].trim(),
                            lng: parseFloat(row["經度"]),
                            lat: parseFloat(row["緯度"]),
                            nearby: row["鄰近地標"] ? row["鄰近地標"].trim() : "", // 🆕 讀取鄰近地標欄位
                            imagePath: row["圖片"] ? row["圖片"].trim() : "",
                            hint_1: row["回饋_1"] ? row["回饋_1"].trim() : "",
                            hint_2: row["回饋_2"] ? row["回饋_2"].trim() : ""
                        }));
                    } else {
                        quizPool = backupQuizPool;
                    }
                    setupGameRounds();
                })
                .catch(err => {
                    quizPool = backupQuizPool;
                    setupGameRounds();
                });
        }

        function setupGameRounds() {
            let categoryKey = (gameMode === "NORMAL") ? "NORMAL" : selectedCategory;
            if (!usedHistory[categoryKey]) usedHistory[categoryKey] = [];

            // 挑出尚未抽過的題目索引
            let availableIndices = [];
            for (let i = 0; i < quizPool.length; i++) {
                if (!usedHistory[categoryKey].includes(i)) {
                    availableIndices.push(i);
                }
            }

            // 若可用題目不足 10 題（或全部抽光），則重置歷史紀錄
            if (availableIndices.length < 10) {
                usedHistory[categoryKey] = [];
                availableIndices = Array.from(Array(quizPool.length).keys());
            }

            // 洗牌抽 10 題
            availableIndices.sort(() => Math.random() - 0.5);
            selectedIndices = availableIndices.slice(0, Math.min(10, availableIndices.length));

            // 紀錄為已使用
            usedHistory[categoryKey].push(...selectedIndices);

            currentRound = 0;
            totalScore = 0;
            loadQuestion();
        }

        // --- 5. 載入題目與多圖切換機制 ---
        function loadQuestion() {
            if (currentMarker) map.removeLayer(currentMarker);
            if (targetMarker) map.removeLayer(targetMarker);
            if (connectionLine) map.removeLayer(connectionLine);
            map.setView([23.6, 120.8], 8);

            if (currentRound >= selectedIndices.length) {
                document.getElementById('question-title').innerText = "🎉 關卡完成！";
                document.getElementById('target-image').style.display = 'none';
                document.getElementById('img-prev-btn').style.display = 'none';
                document.getElementById('img-next-btn').style.display = 'none';
                document.getElementById('feedback-text').innerHTML = `<h3>遊戲結束！總得分：${totalScore} 分！</h3>`;
                document.getElementById('confirm-btn').style.display = 'none';
                gameState = "GAME_OVER";
                return;
            }

            const currentQuiz = quizPool[selectedIndices[currentRound]];
            document.getElementById('status-display').innerText = `進度: ${currentRound + 1}/${selectedIndices.length} | 當前分數: ${totalScore} 分`;
            document.getElementById('question-title').innerText = `找出【${currentQuiz.name}】在哪裡吧！`;

            // 設定圖片路徑 (變態模式自動展開 _1.png ~ _5.png)
            currentImageList = [];
            currentImageIndex = 0;

            if (gameMode === "HARD") {
                // 預期最多檢查 5 張圖片
                const maxPossibleImages = 5;
                let checkedCount = 0;

                for (let i = 1; i <= maxPossibleImages; i++) {
                    const imgPath = `${currentQuiz.imagePath}/${currentQuiz.name}_${i}.png`;
                    const tempImg = new Image();

                    tempImg.onload = function() {
                        // 圖片存在且載入成功，加入輪播清單
                        currentImageList.push(imgPath);
                        checkedCount++;
                        // 當所有圖片都檢測完畢時，更新畫面
                        if (checkedCount === maxPossibleImages) {
                            // 將圖片按數字排序，確保順序是 _1, _2, _3...
                            currentImageList.sort();
                            updateImageDisplay();
                        }
                    };

                    tempImg.onerror = function() {
                        // 圖片不存在 (例如只有 3 張，第 4 張會觸發 onerror)
                        checkedCount++;
                        if (checkedCount === maxPossibleImages) {
                            currentImageList.sort();
                            updateImageDisplay();
                        }
                    };

                    // 發送圖片請求測試
                    tempImg.src = imgPath;
                }
            } else {
                // 正常模式：只有單張圖片
                currentImageList = [currentQuiz.imagePath];
                updateImageDisplay();
            }

            currentImageIndex = 0;
            updateImageDisplay();

            document.getElementById('feedback-text').innerText = "請觀察題目與照片，在地圖上點擊預測落點。";
            document.getElementById('confirm-btn').style.display = 'none';

            userLat = null;
            userLng = null;
            isTyping = false;
            gameState = "WAITING_FIRST_CONFIRM";
        }

        function updateImageDisplay() {
            const img = document.getElementById('target-image');
            img.src = currentImageList[currentImageIndex];
            img.style.display = 'block';

            const prevBtn = document.getElementById('img-prev-btn');
            const nextBtn = document.getElementById('img-next-btn');

            if (currentImageList.length > 1) {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
            } else {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            }
        }

        function changeImage(direction) {
            currentImageIndex += direction;
            if (currentImageIndex < 0) currentImageIndex = currentImageList.length - 1;
            if (currentImageIndex >= currentImageList.length) currentImageIndex = 0;
            updateImageDisplay();
        }

        // --- 6. 經緯度計算與雙階段回饋 (含 Gemini Prompt 客製化) ---
        function calculateHaversine(lat1, lon1, lat2, lon2) {
            const rad = Math.PI / 180;
            const dLat = (lat2 - lat1) * rad;
            const dLon = (lon2 - lon1) * rad;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
            return EARTH_RADIUS_KM * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        async function handleConfirmClick() {
            if (isTyping) return;
            const btn = document.getElementById('confirm-btn');
            btn.disabled = true;
            isTyping = true;

            const currentQuiz = quizPool[selectedIndices[currentRound]];

            if (gameState === "WAITING_FIRST_CONFIRM") {
                document.getElementById('feedback-text').innerText = "🤖 導師正在審閱點擊落點...";
                const firstErrorKm = calculateHaversine(userLat, userLng, currentQuiz.lat, currentQuiz.lng);

                let hintText = "";
                try {
                    let prompt = "";
                    if (gameMode === "HARD") {
                        // 🎯 變態模式第一次提示 (以 CSV 的鄰近地標欄位為主)
                        prompt = `你是一位旅遊導師。學生正在在地圖上尋找『${currentQuiz.name}』（類別：${currentQuiz.category}）。\n` +
                                `該店家附近的真實地標/周邊環境為：【${currentQuiz.nearby}】。\n` +
                                `學生目前的預測點與目標相差 ${firstErrorKm.toFixed(1)} 公里。\n\n` +
                                `【規則要求】：\n` +
                                `1. 告知玩家距離相差 ${firstErrorKm.toFixed(1)} 公里。\n` +
                                `2. 請根據提供給你的周邊資訊【${currentQuiz.nearby}】給予 1~2 個提示，但**絕對不可以直接講出縣市名稱或店名**，避免洩題！\n` +
                                `3. 絕對不可憑空捏造這之外的地標（如台北公館商圈等）。\n` +
                                `4. 字數 80 字以內，語氣幽默活潑。`;
                    } else {
                        prompt = `你是一位幽默的台灣國中地理老師。學生正在尋找【${currentQuiz.name}】。相差 ${firstErrorKm.toFixed(1)} 公里。給予讚美或鼓勵，並提示位置特徵，50字以內。`;
                    }
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    hintText = data.candidates[0].content.parts[0].text.trim();
                } catch (e) {
                    hintText = `目前位置與【${currentQuiz.name}】相距約 ${firstErrorKm.toFixed(1)} 公里！請再仔細觀察微調落點！`;
                }

                typeWriter(hintText, () => {
                    isTyping = false;
                    gameState = "WAITING_SECOND_CONFIRM";
                    btn.style.display = "none";
                });
            } 
            else if (gameState === "WAITING_SECOND_CONFIRM") {
                document.getElementById('feedback-text').innerText = "📊 正在進行精準距離算分與產生介紹講義...";

                const errorKm = calculateHaversine(userLat, userLng, currentQuiz.lat, currentQuiz.lng);
                let score = (errorKm <= 10.0) ? 10 : Math.max(0, Math.floor(10 - (errorKm - 5.0) / 10));
                totalScore += score;

                targetMarker = L.marker([currentQuiz.lat, currentQuiz.lng], {
                    icon: L.icon({
                        iconUrl: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
                        iconSize: [32, 32], iconAnchor: [16, 32]
                    })
                }).addTo(map);

                connectionLine = L.polyline([[userLat, userLng], [currentQuiz.lat, currentQuiz.lng]], {
                    color: '#e63946', weight: 3, dashArray: '5, 10'
                }).addTo(map);

                map.fitBounds(L.latLngBounds([L.latLng(userLat, userLng), L.latLng(currentQuiz.lat, currentQuiz.lng)]), { padding: [50, 50] });

                let knowledgeText = "";
                try {
                    let prompt = "";
                    if (gameMode === "HARD") {
                        // 🎯 變態模式第二次提示 (結合真實地標進行介紹與行程規劃)
                        prompt = `請針對位於『${currentQuiz.nearby}』周邊的『${currentQuiz.name}』（類別：${currentQuiz.category}）撰寫詳細介紹。\n\n` +
                                `【撰寫格式規範】：\n` +
                                `第一段（100~150字）：介紹『${currentQuiz.name}』的店家特色、整體風格與招牌餐點。\n` +
                                `第二段（100~150字）：結合其周邊地標【${currentQuiz.nearby}】，推薦順遊的一日遊或半日遊行程。\n\n` +
                                `兩段請明確分段，語言繁體中文。`;
                    } else {
                        prompt = `請針對『${currentQuiz.name}』撰寫國中地理故事與一日遊推薦，200字左右。`;
                    }

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    knowledgeText = data.candidates[0].content.parts[0].text.trim();
                } catch (e) {
                    knowledgeText = `${currentQuiz.hint_1}\n\n${currentQuiz.hint_2}`;
                }

                const scoreHTML = `<strong>🎯 結算結果：</strong><br>` +
                                `📏 誤差距離：<span style="color:#e63946; font-weight:bold;">${errorKm.toFixed(2)}</span> 公里<br>` +
                                `⭐ 本關得分：<span style="color:#38b000; font-weight:bold;">${score}</span> / 10 分<br><br>` +
                                `🎓 <strong>特色介紹與行程推薦：</strong><br>${knowledgeText}`;

                typeWriter(scoreHTML, () => {
                    isTyping = false;
                    gameState = "ROUND_END";
                    btn.innerText = "下一題";
                    btn.disabled = false;
                    btn.style.display = "block";
                    currentRound++;
                });
            } 
            else if (gameState === "ROUND_END") {
                loadQuestion();
            }
        }
        
        // --- 7. 打字機動畫 ---
        function typeWriter(htmlText, callback) {
            const container = document.getElementById('feedback-text');
            container.innerHTML = "";
            let progress = 0;

            function type() {
                if (htmlText.charAt(progress) === '<') {
                    const closeIndex = htmlText.indexOf('>', progress);
                    progress = (closeIndex !== -1) ? closeIndex + 1 : progress + 1;
                } else {
                    progress++;
                }

                container.innerHTML = htmlText.substring(0, progress);

                if (progress < htmlText.length) {
                    setTimeout(type, 15);
                } else {
                    if (callback) callback();
                }
            }
            type();
        }
    </script>
</body>
</html>
